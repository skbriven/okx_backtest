version: 2

factor:
  path: ./ret_10m.parquet

market:
  instrument: BTC-USDT-SWAP
  swap_directory: D:/crypto/okx/data/swap

returns:
  directory: ./returns
  file_pattern: "{instrument}/{horizon}min.parquet"

time_range:
  start: "2024-01-01T00:00:00Z"
  end: "2025-12-31T00:00:00Z"

backtest:
  prediction_horizons: [10, 30, 60, 180]
  direction:
    method: rolling_ic
    window: 30D
    min_observations: 43200
  grouping:
    quantiles: 10
    long_groups: [10]
    short_groups: [1]
  costs:
    fee_bps: 0
    slippage_bps: 0.001

admission:
  mode: per_horizon
  rules:
    min_valid_samples: 100000
    min_coverage: 0.95
    min_ic: 0.03
    min_icir: 0.5

registry:
  directory: ./factor_store
  copy_factor_file: false
  overwrite: false

output:
  directory: ./results
  save_metrics_json: true
  save_strategy_parquet: true
  save_report_png: true
  save_report_html: true
  save_config_snapshot: true
